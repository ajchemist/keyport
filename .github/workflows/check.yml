name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run types
      - run: git diff --exit-code worker-configuration.d.ts
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bun run db:local
      - run: bun run db:local
      - run: bunx --bun wrangler deploy --dry-run --outdir .wrangler/dry-run
      - run: bun run preview --dry-run --outdir .wrangler/preview-dry-run
