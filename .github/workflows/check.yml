name: 검증
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: git diff --exit-code worker-configuration.d.ts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run db:local
      - run: npm run db:local
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
